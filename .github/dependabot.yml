# 依存パッケージの更新を毎週チェックして、更新の提案（プルリクエスト）を作る
# 大きな変更（メジャーバージョンアップ）は動作が壊れやすいため自動提案の対象外とし、必要に応じて手動で対応する
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
